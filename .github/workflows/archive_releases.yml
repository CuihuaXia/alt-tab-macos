# Mirrors the newest upstream AltTab releases into this fork's GitHub Releases, so they
# stay downloadable even if upstream prunes old assets. See archive/README.md.
# Binaries go to Release assets, never into git history.
name: archive releases
on:
  push:
    branches: [master]
    paths: [archive/releases.json, .github/workflows/archive_releases.yml]
  workflow_dispatch:
    inputs:
      count:
        description: How many of the newest upstream releases to archive
        default: "10"
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
concurrency: archive-releases
jobs:
  archive:
    if: github.repository_owner != 'lwouis'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      UPSTREAM: lwouis/alt-tab-macos
    steps:
      - uses: actions/checkout@v6
      - name: Refresh manifest from upstream appcast.xml
        run: python3 archive/archive.py manifest --count "${{ inputs.count || '10' }}" --archive-repo "$REPO"
      - name: Upload missing releases
        run: |
          mkdir -p dist
          jq -r '.releases[] | [.version, .tag, .asset, .sha256, .minimum_macos, .published_at] | @tsv' archive/releases.json |
          while IFS=$'\t' read -r version tag asset sha256 min_macos published; do
            if gh release view "$tag" --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
              echo "$tag already archived"; continue
            fi
            if ! gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              sha=$(git ls-remote "https://github.com/$UPSTREAM" "refs/tags/$tag" "refs/tags/$tag^{}" | tail -1 | cut -f1)
              gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            python3 archive/archive.py download "$version" --dir dist
            notes="Archived copy of upstream [AltTab $version](https://github.com/$UPSTREAM/releases/tag/$tag), published upstream on $published.

          - Requires macOS $min_macos or newer
          - SHA-256: \`$sha256\`
          - Install: unzip, then move \`AltTab.app\` to /Applications. Or run \`python3 archive/archive.py install $version\`."
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$tag" "dist/$asset" --repo "$REPO"
            else
              gh release create "$tag" "dist/$asset" --repo "$REPO" --verify-tag --title "AltTab $version (archived)" --notes "$notes"
            fi
          done
      - name: Commit manifest changes
        run: |
          git add archive/releases.json archive/SHA256SUMS
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(archive): update archived releases manifest"
          git push
